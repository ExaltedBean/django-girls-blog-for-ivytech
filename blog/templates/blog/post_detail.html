{% extends 'blog/base.html' %}

{% if user.is_authenticated %}
    <a class="btn btn-secondary" href="{% url 'post_edit' pk=post.pk %}">
        {% include './icons/pencil-fill.svg' %}
    </a>
{% endif %}

{% block content %}
    <article class="post">
        <h1>{{ post.title }}</h1>
        <time class="date">
            {{ post.published_date }}
        </time>
        <p>{{ post.text|linebreaksbr }}</p>
    </article>
{% endblock %}
